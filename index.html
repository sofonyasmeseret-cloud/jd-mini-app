<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JD Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            text-align: center;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        input {
            padding: 10px;
            width: 80%;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>JD Mini App</h1>
    <p id="user-greeting">Loading user info...</p>

    <input type="text" id="userInput" placeholder="Type something to send to JD..."><br>
    <button id="sendBtn">Send to Bot</button>
    <button id="speakBtn">Speak Text</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-greeting').innerText =
                `Hello, ${tg.initDataUnsafe.user.first_name}!`;
        }

        document.getElementById('sendBtn').addEventListener('click', () => {
            const textValue = document.getElementById('userInput').value;
            const payload = JSON.stringify({ message: textValue });
            tg.sendData(payload);
        });

        document.getElementById('speakBtn').addEventListener('click', () => {
            const textValue = document.getElementById('userInput').value;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(textValue);
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Speech synthesis not supported in this browser.');
            }
        });
    </script>
</body>
</html>
